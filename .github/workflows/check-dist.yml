# This workflow is managed by gh actions-lock.

name: Check Dist

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  check-dist:
    name: Check bundled dist/ is up-to-date
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Pin npm version
        run: |
          $packageManager = node -p "require('./package.json').packageManager ?? ''"
          if ($packageManager -notmatch '^npm@(.+)$') {
            throw "Expected packageManager in package.json to be in the format npm@<version>, got '$packageManager'"
          }

          $npmVersion = $Matches[1]
          npm i -g "npm@$npmVersion"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build and bundle
        run: |
          npm run build
          npm run bundle

      - name: Verify runtime dependency manifests
        run: |
          test -f packages/github-action/dist/runtime-dependencies.json
          test -f packages/azdo-task/dist/package.json
          test -f packages/azdo-task/dist/package-lock.json
        shell: bash

      - name: Compare the expected and actual dist/ directories
        # For the Azure Pipelines task only the dependency manifests are
        # committed (dist ships inside the VSIX); they must stay in sync so
        # release builds can restore the VSIX runtime dependencies with
        # `npm ci` (frozen bundle) instead of install/dedupe/audit-fix.
        run: |
          if ! git diff --quiet -- \
            packages/github-action/dist/ \
            packages/azdo-task/dist/package.json \
            packages/azdo-task/dist/package-lock.json; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff --name-status -- packages/github-action/dist/ packages/azdo-task/dist/
            git diff -- packages/github-action/dist/ packages/azdo-task/dist/
            exit 1
          fi
        id: diff
        shell: bash

      - name: Upload diff
        uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist-diff
          path: |
            packages/github-action/dist/
