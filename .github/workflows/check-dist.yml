name: Check Dist

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  check-dist:
    name: Check bundled dist/ is up-to-date
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Pin npm version
        run: |
          $packageManager = node -p "require('./package.json').packageManager ?? ''"
          if ($packageManager -notmatch '^npm@(.+)$') {
            throw "Expected packageManager in package.json to be in the format npm@<version>, got '$packageManager'"
          }

          $npmVersion = $Matches[1]
          npm i -g "npm@$npmVersion"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and bundle
        run: |
          npm run build
          npm run bundle:actions

      - name: Verify runtime dependency manifests
        run: |
          test -f packages/github-action/dist/runtime-dependencies.json
        shell: bash

      - name: Compare the expected and actual dist/ directories
        run: |
          if ! git diff --quiet -- packages/github-action/dist/; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff --name-status -- packages/github-action/dist/
            git diff -- packages/github-action/dist/
            exit 1
          fi
        id: diff
        shell: bash

      - name: Upload diff
        uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist-diff
          path: |
            packages/github-action/dist/
