# This workflow is managed by gh actions-lock.

name: Pre-commit

on:
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install pre-commit and zizmor
        # Plain (non --user) install so the `zizmor` binary invoked by the
        # pre-commit hook (language: system) is on PATH.
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run pre-commit
        run: python3 -m pre_commit run --all-files
