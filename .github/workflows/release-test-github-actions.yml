# This workflow is managed by gh actions-lock.

name: Test GitHub Actions

# Triggered by the release workflow to validate the root GitHub Action
# against a small sample extension using PAT and OIDC auth types.
#
# Required secrets:
#   AZURE_CLIENT_ID   - Azure AD app client ID for workflow authentication
#   AZURE_TENANT_ID   - Azure AD tenant ID for workflow authentication

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test'
        required: false
        type: string
      os:
        description: 'Runner OS for the GitHub Action validation'
        required: false
        type: string
        default: ubuntu-latest
      auth-type:
        description: 'Authentication mode to validate'
        required: false
        type: string
        default: pat

permissions: {}

env:
  PUBLISHER_ID: jessehouwing
  INITIAL_VERSION: '1.0.0'

jobs:
  test:
    name: Test (${{ inputs.auth-type }}, ${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    environment: publisher-jessehouwing

    permissions:
      contents: read
      id-token: write

    env:
      EXTENSION_ID: ${{ format('azdo-gha-{0}-{1}', inputs.auth-type, inputs.os == 'ubuntu-latest' && 'ubuntu' || 'windows') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Verifies the dist/ provenance attestation created in release.yml's
      # prepare-release job. The attested subject is a deterministic
      # `git archive` tarball of the release commit's dist/ tree; the same
      # command against the same commit reproduces byte-identical output, so
      # regenerating and verifying it here proves this checkout's dist/
      # matches what was built and attested.
      - name: Verify GitHub Action dist/ build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --output "$RUNNER_TEMP/github-action-dist.tar" HEAD packages/github-action/dist
          gh attestation verify "$RUNNER_TEMP/github-action-dist.tar" --repo "$GITHUB_REPOSITORY"

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # --- Azure login for workflow token acquisition ---
      - name: Azure login
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - id: azure-devops-token
        name: Get Azure DevOps bearer token
        if: ${{ inputs.auth-type == 'pat' }}
        shell: pwsh
        run: |
          $token = az account get-access-token `
            --resource 499b84ac-1321-427f-aa17-267ca6975798 `
            --query accessToken --output tsv
          Write-Host "::add-mask::$token"
          "token=$token" >> $env:GITHUB_OUTPUT

      # --- Query version ---
      - id: query
        name: Query next patch version
        continue-on-error: true
        uses: $/
        with:
          operation: query-version
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}
          version-source: |
            manifest
            marketplace
            1.0.0
          marketplace-version-action: Patch

      # --- Package (manifest mode) ---
      - id: package-manifest
        name: Package from manifest
        uses: $/
        with:
          operation: package
          working-directory: tests/sample-extension
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}
          extension-version: ${{ steps.query.outputs.proposed-version }}
          extension-visibility: private_preview
          update-tasks-version: major
          update-tasks-id: true
          manifest-file: vss-extension.json

      # --- Publish (vsix mode) ---
      - name: Publish from VSIX
        uses: $/
        id: publish
        with:
          operation: publish
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          use: vsix
          vsix-file: ${{ steps.package-manifest.outputs.vsix-file }}
          no-wait-validation: true

      # --- Wait for validation ---
      - name: Wait for validation
        uses: $/
        with:
          operation: wait-for-validation
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
      # --- Show extension ---
      - name: Show extension metadata
        uses: $/
        with:
          operation: show
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}

      # --- Share ---
      - name: Share extension
        uses: $/
        with:
          operation: share
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing-dev

      # --- Install ---
      - name: Install extension
        uses: $/
        with:
          operation: install
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing-dev

      # --- Wait for installation ---
      - name: Wait for installation
        uses: $/
        with:
          operation: wait-for-installation
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing-dev

      # --- Unshare ---
      - name: Unshare extension
        uses: $/
        with:
          operation: unshare
          auth-type: ${{ inputs.auth-type }}
          token: ${{ inputs.auth-type == 'pat' && steps.azure-devops-token.outputs.token || '' }}
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing-dev
