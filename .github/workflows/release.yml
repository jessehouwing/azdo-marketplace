# This workflow is managed by gh actions-lock.

name: Release
run-name: Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name || github.ref }}

# Multi-job release workflow for Azure DevOps extension and GitHub Actions.
#
# Required secrets:
#   AZURE_CLIENT_ID       - Azure AD app client ID for OIDC authentication
#   AZURE_TENANT_ID       - Azure AD tenant ID for OIDC authentication
#
# Required repository variables:
#   AZDO_TEST_PIPELINE_NAME  - Name of the Azure DevOps test pipeline to trigger
#
# Required environments (with protection rules):
#   publisher-jessehouwing-dev  - For preview release and GitHub Actions tests
#   publisher-jessehouwing      - For production releases (job 4, requires approval)
#   release-publish-approval    - Single consolidated manual gate before any
#                                 irreversible action (immutable GitHub
#                                 release, Marketplace publish). Additive to
#                                 the environments above, not a replacement.

on:
  push:
    branches:
      - 'release/v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g., 6.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Test only: validate the release without creating an immutable GitHub release or publishing to the Marketplace'
        required: false
        type: boolean
        default: false

permissions: {}

env:
  PUBLISHER_ID: jessehouwing
  PUBLISHER_ID_DEV: jessehouwing
  EXTENSION_ID: azdo-marketplace-extension

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Prepare release branch
  # Idempotent — safe to re-run after pushing fixes to the release branch.
  # ---------------------------------------------------------------------------
  prepare-release:
    name: Prepare release
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      branch: release/v${{ steps.resolve.outputs.version }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
      patch: ${{ steps.parse.outputs.patch }}
      vsix-file-name: ${{ steps.package.outputs.vsix-file-name }}
      vsix-attestation-url: ${{ steps.attest-vsix.outputs.attestation-url }}
      github-action-dist-attestation-url: ${{ steps.attest-github-action-dist.outputs.attestation-url }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Resolve version
        id: resolve
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
          }
          else {
            # Extract version from branch name: release/vX.Y.Z -> X.Y.Z
            $version = $env:REF_NAME -replace '^release/v', ''
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate version format
        shell: pwsh
        run: |
          if ("${{ steps.resolve.outputs.version }}" -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Host "::error::Version must be in format x.y.z (e.g., 6.1.0)"
            exit 1
          }

      - name: Parse version components
        id: parse
        shell: pwsh
        run: |
          $major, $minor, $patch = "${{ steps.resolve.outputs.version }}".Split('.')
          "major=$major" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "patch=$patch" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Create or checkout release branch
        shell: pwsh
        env:
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          $branch = "release/v${{ steps.resolve.outputs.version }}"
          git ls-remote --exit-code --heads origin $branch *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Branch $branch already exists, checking it out"
            git fetch origin $branch
            git checkout $branch
            git pull origin $branch
          }
          else {
            Write-Host "Creating branch $branch from $env:SOURCE_REF_NAME"
            git checkout -b $branch
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          # Release builds must not restore from (poisonable) runtime caches
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pre-commit and zizmor
        # Plain (non --user) install so the `zizmor` binary invoked by the
        # pre-commit hook (language: system) is on PATH.
        run: python3 -m pip install -r requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      - name: Update version references
        run: node Scripts/update-version.mjs ${{ steps.resolve.outputs.version }}

      - name: Format
        continue-on-error: true
        run: npm run format

      - name: Lint fix
        run: npm run lint:fix

      - name: Sync action inputs
        run: npm run sync:action-inputs

      - name: Build
        run: npm run build

      - name: Test
        # Disable workflow commands during test execution to prevent test
        # output (e.g. ##vso or ::set-output) from being interpreted as
        # actual workflow commands.
        shell: pwsh
        run: |
          $stopMarker = [guid]::NewGuid().ToString()
          Write-Host "::stop-commands::$stopMarker"
          npm run test
          Write-Host "::$stopMarker::"

      - name: Bundle
        # Frozen bundle: restores dist runtime dependencies with `npm ci`
        # from the committed lockfile and skips `npm install`/`npm dedupe`/
        # `npm audit fix` — the release must ship exactly the dependency
        # tree that was reviewed and committed (check-dist.yml enforces
        # that dedupe/audit output is committed on main/PRs).
        run: npm run bundle:frozen

      - name: Verify no dependency drift after frozen bundle
        shell: bash
        # bundle.js content may legitimately change here (version bump —
        # committed below), but the dependency manifests must be untouched:
        # any diff means the committed dist lockfile/dedupe state is stale
        # and check-dist should have caught it before releasing.
        run: |
          git diff --exit-code -- \
            packages/github-action/dist/package.json \
            packages/github-action/dist/package-lock.json \
            packages/github-action/dist/runtime-dependencies.json \
            packages/github-action/dist/node_modules \
            packages/azdo-task/dist/package.json \
            packages/azdo-task/dist/package-lock.json

      - name: Run pre-commit checks
        shell: pwsh
        continue-on-error: true
        run: python3 -m pre_commit run --all-files

      - name: Package Azure DevOps extension
        uses: jessehouwing/azdo-marketplace/package@v6.2.10
        id: package
        with:
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}
          extension-version: ${{ steps.resolve.outputs.version }}
          output-path: ${{ runner.temp }}

      # Attests the exact VSIX bytes produced here. Nothing downstream may
      # re-package or apply overrides (extension-version/update-tasks-id/etc.)
      # to this file — publish-production and create-release both consume it
      # unmodified via actions/download-artifact, so the attested digest
      # matches what's ultimately published/released bit-for-bit. The
      # updated task.json files written to the filesystem by this packaging
      # step are committed below (git add -A), so the repo state also
      # reflects exactly what was packaged/attested.
      #
      # This is a Sigstore/GitHub-OIDC keyless attestation over a single
      # external digest — a supply-chain provenance signal consumed by this
      # repo's own release/publish jobs (`gh attestation verify`). It is
      # NOT the same as an OPC (Open Packaging Conventions) XML-DSig
      # signature — the Authenticode-family, X.509-based signing scheme
      # Visual Studio/tfx natively recognize for VSIX packages (the same
      # mechanism used to sign Office OOXML documents). Real OPC signing of
      # the VSIX (e.g. via Microsoft's `sign` CLI + Azure Trusted Signing)
      # is deferred future work — see plan.md — pending an Azure Trusted
      # Signing account; it would complement, not replace, this attestation.
      - name: Attest build provenance (VSIX)
        id: attest-vsix
        uses: actions/attest-build-provenance@v4.0.0
        with:
          subject-path: ${{ steps.package.outputs.vsix-file }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix-file }}
          if-no-files-found: error

      - name: Commit and push changes
        shell: pwsh
        run: |
          $branch = "release/v${{ steps.resolve.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
          }
          else {
            git commit -m "chore: prepare release v${{ steps.resolve.outputs.version }}"
          }
          git push origin "HEAD:$branch"

      # GitHub Action provenance rationale: unlike the VSIX (a built binary
      # artifact published to the Marketplace), the GitHub Action itself is
      # consumed directly as source at a git tag/SHA
      # (`uses: jessehouwing/azdo-marketplace@vX`) — there is no separate
      # release asset to attach evidence to. Its provenance is therefore a
      # Sigstore attestation over the committed dist/ tree at the release
      # commit, PLUS the immutable git tag, PLUS the test-github-actions job
      # exercising this same commit before it can reach release-approval.
      #
      # dist/ contains thousands of files (bundled runtime node_modules),
      # far beyond attest-build-provenance's per-file subject limits, so a
      # single deterministic tarball digest is attested instead:
      # `git archive` output depends only on the commit (blob contents +
      # commit timestamp — no working-tree/EOL/platform variance), so
      # release-test-github-actions.yml can regenerate the byte-identical
      # archive from its own checkout of this commit and verify it with one
      # `gh attestation verify` call. This step runs after "Commit and push
      # changes" so HEAD is the exact release-branch commit being tested.
      - name: Create deterministic GitHub Action dist/ archive
        shell: bash
        run: git archive --format=tar --output "$RUNNER_TEMP/github-action-dist.tar" HEAD packages/github-action/dist

      - name: Attest build provenance (GitHub Action dist/)
        id: attest-github-action-dist
        uses: actions/attest-build-provenance@v4.0.0
        with:
          subject-path: ${{ runner.temp }}/github-action-dist.tar

  # ---------------------------------------------------------------------------
  # Job 2: Validate documentation version references
  # Ensures docs and action examples only reference the version being released.
  # ---------------------------------------------------------------------------
  validate-documentation-versions:
    name: Validate documentation versions
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}
          sparse-checkout: |
            **/action.yaml
            **/action.yml
            **/action.schema.yaml
            **/action.schema.yml
            **/*.md
          sparse-checkout-cone-mode: false

      - name: Validate documentation action versions
        uses: jessehouwing/actions-example-checker@v0.0.11
        with:
          version: v${{ needs.prepare-release.outputs.version }}

  # ---------------------------------------------------------------------------
  # Job 3: Preview release to Azure DevOps
  # Publishes a private preview extension with unique task IDs to the dev org.
  # ---------------------------------------------------------------------------
  preview-release:
    name: Preview release (Azure DevOps)
    needs: [prepare-release, validate-documentation-versions]
    runs-on: windows-latest
    environment:
      name: 'publisher-jessehouwing'
      url: https://marketplace.visualstudio.com/items?itemName=${{ env.PUBLISHER_ID_DEV }}.${{ env.EXTENSION_ID }}-pre

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          # Release builds must not restore from (poisonable) runtime caches
          package-manager-cache: false

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish preview extension
        uses: jessehouwing/azdo-marketplace/publish@v6.2.10
        id: publish
        with:
          auth-type: oidc
          use: vsix
          vsix-file: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
          publisher-id: ${{ env.PUBLISHER_ID_DEV }}
          extension-id: ${{ env.EXTENSION_ID }}-pre
          extension-visibility: private_preview
          update-tasks-id: true
          no-wait-validation: true

      - name: Wait for validation
        uses: jessehouwing/azdo-marketplace/wait-for-validation@v6.2.10
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file }}

      - name: Share extension
        uses: jessehouwing/azdo-marketplace/share@v6.2.10
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing

      - name: Install extension
        uses: jessehouwing/azdo-marketplace/install@v6.2.10
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing

      - name: Wait for installation
        uses: jessehouwing/azdo-marketplace/wait-for-installation@v6.2.10
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file }}
          accounts: |
            https://dev.azure.com/jessehouwing

  # ---------------------------------------------------------------------------
  # Job 4: Test Azure Pipelines
  # Triggers the Azure DevOps test pipeline and waits for completion.
  # ---------------------------------------------------------------------------
  test-azure-pipelines:
    name: Test Azure Pipelines
    needs: [prepare-release, preview-release]
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - vmImage: ubuntu-latest
            connectionType: PAT
          - vmImage: ubuntu-latest
            connectionType: AzureRM
          - vmImage: windows-latest
            connectionType: PAT
          - vmImage: windows-latest
            connectionType: AzureRM
    environment:
      name: 'publisher-jessehouwing'
      url: ${{ steps.run-azdo-pipeline.outputs.pipeline_run_url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Azure DevOps access token
        id: get-azdo-token
        shell: pwsh
        run: |
          $token = az account get-access-token `
            --resource 499b84ac-1321-427f-aa17-267ca6975798 `
            --query accessToken --output tsv
          Write-Host "::add-mask::$token"
          echo "azdo_token=$token" >> $env:GITHUB_OUTPUT

      - name: Run Azure DevOps test pipeline
        id: run-azdo-pipeline
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ steps.get-azdo-token.outputs.azdo_token }}
          AZDO_PIPELINE_NAME: ${{ vars.AZDO_TEST_PIPELINE_NAME }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          AZDO_ORGANIZATION: https://dev.azure.com/jessehouwing
          AZDO_PROJECT: azure-devops-extensions
          TEST_VM_IMAGE: ${{ matrix.vmImage }}
          TEST_CONNECTION_TYPE: ${{ matrix.connectionType }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Az {
            param(
              [Parameter(Mandatory = $true)]
              [string[]]$Arguments
            )

            $output = & az @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Azure CLI command failed: az $($Arguments -join ' ')"
            }

            return $output
          }

          $organization = $env:AZDO_ORGANIZATION
          $project = $env:AZDO_PROJECT
          $pipelineName = $env:AZDO_PIPELINE_NAME
          $branch = "release/v$($env:RELEASE_VERSION)"
          $timeoutSeconds = 1800
          $intervalSeconds = 30

          if (-not $organization) {
            throw 'AZDO_ORGANIZATION is empty.'
          }

          if (-not $project) {
            throw 'AZDO_PROJECT is empty.'
          }

          if (-not $pipelineName) {
            throw 'AZDO_PIPELINE_NAME is empty. Set repository variable AZDO_TEST_PIPELINE_NAME.'
          }

          if (-not $env:RELEASE_VERSION) {
            throw 'RELEASE_VERSION is empty. Prepare release output is missing.'
          }

          switch ($env:TEST_CONNECTION_TYPE) {
            'PAT' { }
            'AzureRM' { }
            default { throw "Unsupported TEST_CONNECTION_TYPE: $($env:TEST_CONNECTION_TYPE)" }
          }

          $osSuffix = switch ($env:TEST_VM_IMAGE) {
            'ubuntu-latest' { 'ubuntu' }
            'windows-latest' { 'windows' }
            default { throw "Unsupported TEST_VM_IMAGE: $($env:TEST_VM_IMAGE)" }
          }

          $extensionId = "azdo-azp-$($env:TEST_CONNECTION_TYPE)-$osSuffix"

          Invoke-Az -Arguments @('config', 'set', 'extension.use_dynamic_install=yes_without_prompt') | Out-Null
          Invoke-Az -Arguments @('extension', 'add', '--name', 'azure-devops', '--upgrade', '--only-show-errors') | Out-Null

          if (-not $env:AZURE_DEVOPS_EXT_PAT) {
            throw 'AZURE_DEVOPS_EXT_PAT is not set. Token step must run before this step.'
          }

          # Disable secure credential store (doesn't work on hosted runners)
          Invoke-Az -Arguments @('config', 'set', 'core.enable_secure_credential_store=false') | Out-Null
          Invoke-Az -Arguments @('devops', 'configure', '--defaults', "organization=$organization", "project=$project") | Out-Null

          $runId = (Invoke-Az -Arguments @(
            'pipelines', 'run',
            '--name', $pipelineName,
            '--branch', $branch,
            '--org', $organization,
            '--project', $project,
            '--detect', 'false',
            '--parameters',
            "vmImage=$($env:TEST_VM_IMAGE)",
            "connectionType=$($env:TEST_CONNECTION_TYPE)",
            "extensionId=$extensionId",
            '--query', 'id',
            '--output', 'tsv'
          )).Trim()

          if (-not $runId) {
            throw 'Failed to trigger Azure DevOps pipeline run.'
          }

          "pipeline_run_id=$runId" >> $env:GITHUB_OUTPUT
          $runUrl = "$organization/$project/_build/results?buildId=$runId&view=results"
          "pipeline_run_url=$runUrl" >> $env:GITHUB_OUTPUT

          Write-Host "Triggered pipeline run: $runId"
          Write-Host "Pipeline run URL: $runUrl"
          "- Azure Pipelines run: [$runId]($runUrl)" >> $env:GITHUB_STEP_SUMMARY

          $elapsed = 0
          while ($elapsed -lt $timeoutSeconds) {
            $runJson = Invoke-Az -Arguments @(
              'pipelines', 'runs', 'show',
              '--id', $runId,
              '--org', $organization,
              '--project', $project,
              '--detect', 'false',
              '--output', 'json'
            )
            $run = $runJson | ConvertFrom-Json

            $status = if ($null -ne $run.status) { [string]$run.status } else { '' }
            $result = if ($null -ne $run.result) { [string]$run.result } else { '' }

            Write-Host "Pipeline status: $status, result: $result (${elapsed}s elapsed)"

            if ($status -eq 'completed') {
              if ($result -eq 'succeeded') {
                Write-Host 'Pipeline succeeded'
                exit 0
              }

              throw "Pipeline failed with result: $result"
            }

            Start-Sleep -Seconds $intervalSeconds
            $elapsed += $intervalSeconds
          }

          throw "Pipeline timed out after ${timeoutSeconds}s"

      - name: Cancel Azure DevOps pipeline run if parent workflow was cancelled
        if: ${{ cancelled() && steps.run-azdo-pipeline.outputs.pipeline_run_id != '' }}
        continue-on-error: true
        env:
          AZDO_PIPELINE_RUN_ID: ${{ steps.run-azdo-pipeline.outputs.pipeline_run_id }}
          AZDO_ORGANIZATION: https://dev.azure.com/jessehouwing
          AZDO_PROJECT: azure-devops-extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:AZDO_PIPELINE_RUN_ID) {
            exit 0
          }

          try {
            az pipelines runs cancel `
              --id $env:AZDO_PIPELINE_RUN_ID `
              --org $env:AZDO_ORGANIZATION `
              --project $env:AZDO_PROJECT `
              --detect false `
              --output none

            Write-Host "Cancelled Azure DevOps pipeline run $($env:AZDO_PIPELINE_RUN_ID) because the parent release workflow was cancelled."
          }
          catch {
            Write-Warning "Unable to cancel Azure DevOps pipeline run $($env:AZDO_PIPELINE_RUN_ID): $($_.Exception.Message)"
            exit 0
          }

  # ---------------------------------------------------------------------------
  # Job 5: Test GitHub Actions
  # Matrix queues 4 independent verification runs, each of which dispatches
  # the release-test-github-actions workflow against the exact release ref and
  # waits for completion before reporting back success/failure to the parent
  # release pipeline. This keeps the rerun granularity and branch/version
  # correctness of the original dispatch-and-wait pattern.
  # ---------------------------------------------------------------------------
  test-github-actions:
    name: Test GitHub Actions v${{ needs.prepare-release.outputs.version }} (${{ matrix.auth-type }}, ${{ matrix.os }})
    needs: [prepare-release, validate-documentation-versions]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            auth-type: pat
          - os: ubuntu-latest
            auth-type: oidc
          - os: windows-latest
            auth-type: pat
          - os: windows-latest
            auth-type: oidc
    environment:
      name: 'publisher-jessehouwing'
      url: ${{ steps.dispatch.outputs.run_url }}
    permissions:
      actions: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Dispatch and wait for the GitHub Actions test workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: release/v${{ needs.prepare-release.outputs.version }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          OS: ${{ matrix.os }}
          AUTH_TYPE: ${{ matrix.auth-type }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $timeoutSeconds = 1800
          $intervalSeconds = 15

          $runUrl = gh workflow run release-test-github-actions.yml `
            --repo $env:GITHUB_REPOSITORY `
            --ref $env:BRANCH `
            -f "ref=$env:BRANCH" `
            -f "version=$env:RELEASE_VERSION" `
            -f "os=$env:OS" `
            -f "auth-type=$env:AUTH_TYPE"
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to dispatch release-test-github-actions.yml.'
          }

          $runId = $runUrl.Trim().Split('/')[-1]
          if ($runId -notmatch '^[0-9]+$') {
            throw "gh workflow run did not return a run URL: $runUrl"
          }

          "run_id=$runId" >> $env:GITHUB_OUTPUT
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$runId"
          "run_url=$runUrl" >> $env:GITHUB_OUTPUT
          "- GitHub Actions test run [$($env:AUTH_TYPE), $($env:OS)]: [$runId]($runUrl)" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Triggered release-test-github-actions.yml run: $runId"
          Write-Host "Workflow URL: $runUrl"

          $elapsed = 0
          while ($elapsed -lt $timeoutSeconds) {
            $status = gh run view $runId --repo $env:GITHUB_REPOSITORY --json status --jq '.status'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to query run $runId status."
            }

            $status = $status.Trim()
            if ($status -eq 'completed') {
              $conclusion = gh run view $runId --repo $env:GITHUB_REPOSITORY --json conclusion --jq '.conclusion'
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to query run $runId conclusion."
              }

              $conclusion = $conclusion.Trim()
              Write-Host "Run $runId completed with conclusion: $conclusion"
              if ($conclusion -eq 'success') {
                exit 0
              }

              throw "release-test-github-actions.yml run $runId finished with conclusion: $conclusion"
            }

            Write-Host "Run $runId status: $status ($elapsed`s elapsed)"
            Start-Sleep -Seconds $intervalSeconds
            $elapsed += $intervalSeconds
          }

          throw "release-test-github-actions.yml run $runId timed out after $timeoutSeconds seconds"

      - name: Cancel GitHub Actions verification run if parent workflow was cancelled
        if: ${{ cancelled() && steps.dispatch.outputs.run_id != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RUN_ID) {
            exit 0
          }

          try {
            gh run cancel $env:RUN_ID --repo $env:GITHUB_REPOSITORY
            Write-Host "Cancelled GitHub Actions verification run $($env:RUN_ID) because the parent release workflow was cancelled."
          }
          catch {
            Write-Warning "Unable to cancel GitHub Actions verification run $($env:RUN_ID): $($_.Exception.Message)"
            exit 0
          }

  # ---------------------------------------------------------------------------
  # Job 5b: Release approval gate
  # Single consolidated manual approval, additive to any existing per-job
  # environment gates. Holds the workflow after all preview/test jobs
  # complete and before anything irreversible (immutable GitHub release,
  # Marketplace publish) happens. Skipped entirely in dry-run mode, since
  # nothing irreversible happens there.
  # ---------------------------------------------------------------------------
  release-approval:
    name: Approve release and publish
    needs:
      [prepare-release, preview-release, test-azure-pipelines, test-github-actions, create-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: release-publish-approval
    permissions: {}
    steps:
      - name: Approved
        run: echo "Approved release v${{ needs.prepare-release.outputs.version }} for immutable release and Marketplace publish."

  # ---------------------------------------------------------------------------
  # Job 6: Production release to marketplace
  # Requires environment approval before running.
  # ---------------------------------------------------------------------------
  publish-production:
    name: Publish to marketplace
    needs:
      [
        prepare-release,
        preview-release,
        test-azure-pipelines,
        test-github-actions,
        release-approval,
      ]
    if: ${{ !inputs.dry_run }}
    runs-on: windows-latest
    environment:
      name: publisher-jessehouwing
      url: https://marketplace.visualstudio.com/items?itemName=${{ env.PUBLISHER_ID }}.${{ env.EXTENSION_ID }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          # Release builds must not restore from (poisonable) runtime caches
          package-manager-cache: false

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Verify VSIX build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSIX_FILE: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
        run: gh attestation verify "$VSIX_FILE" --repo "$GITHUB_REPOSITORY"
        shell: bash

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Detects a retry after the exact version was already published (e.g. a
      # previous run's publish succeeded but "Wait for validation" timed out),
      # so we don't attempt to republish the same version.
      - name: Check current marketplace version
        id: check-version
        uses: jessehouwing/azdo-marketplace/query-version@v6.2.10
        with:
          auth-type: oidc
          publisher-id: ${{ env.PUBLISHER_ID }}
          extension-id: ${{ env.EXTENSION_ID }}
          version-source: marketplace
          marketplace-version-action: None

      - name: Skip publish (version already deployed)
        if: steps.check-version.outputs.current-version == needs.prepare-release.outputs.version
        run: Write-Host "Version ${{ needs.prepare-release.outputs.version }} is already published, skipping publish and re-checking validation."
        shell: pwsh

      - name: Publish production extension
        id: publish
        if: steps.check-version.outputs.current-version != needs.prepare-release.outputs.version
        uses: jessehouwing/azdo-marketplace/publish@v6.2.10
        with:
          auth-type: oidc
          use: vsix
          vsix-file: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
          no-wait-validation: true

      - name: Wait for validation
        uses: jessehouwing/azdo-marketplace/wait-for-validation@v6.2.10
        with:
          auth-type: oidc
          vsix-file: ${{ steps.publish.outputs.vsix-file || format('{0}/vsix/{1}', runner.temp, needs.prepare-release.outputs.vsix-file-name) }}

  # ---------------------------------------------------------------------------
  # Job 7: Create GitHub draft release and tags
  # Runs in parallel with publish-production after preview and both test jobs.
  # The draft is published only after the marketplace release succeeds.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub draft release
    needs: [prepare-release, preview-release, test-azure-pipelines, test-github-actions]
    # Always runs (even in dry-run) to create/update the real, testable
    # version tag; the release-object-creation step below is what's actually
    # gated on !inputs.dry_run.
    if: |
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.preview-release.result == 'success' &&
      needs.test-azure-pipelines.result == 'success' &&
      needs.test-github-actions.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}
          fetch-depth: 0

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Verify VSIX build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSIX_FILE: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
        run: gh attestation verify "$VSIX_FILE" --repo "$GITHUB_REPOSITORY"
        shell: bash

      - name: Create version tag
        shell: pwsh
        run: |
          $version = "v${{ needs.prepare-release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create or update the exact version tag
          git tag -fa $version -m "Release $version" HEAD
          git push origin $version --force

      - name: Create GitHub draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: v${{ needs.prepare-release.outputs.version }}
          VSIX_FILE: ${{ runner.temp }}/vsix/${{ needs.prepare-release.outputs.vsix-file-name }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          VSIX_ATTESTATION_URL: ${{ needs.prepare-release.outputs.vsix-attestation-url }}
          GITHUB_ACTION_DIST_ATTESTATION_URL: ${{ needs.prepare-release.outputs.github-action-dist-attestation-url }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $vsixFile = $env:VSIX_FILE
          $repository = $env:GITHUB_REPOSITORY_NAME

          # Determine previous semantic version tag for generated release notes.
          $currentVersion = [System.Management.Automation.SemanticVersion]($version.TrimStart('v'))
          $previousTag = git tag --list 'v*.*.*' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object {
              [PSCustomObject]@{
                Tag = $_
                Version = [System.Management.Automation.SemanticVersion]($_.TrimStart('v'))
              }
            } |
            Where-Object { $_.Version -lt $currentVersion } |
            Sort-Object Version -Descending |
            Select-Object -First 1 -ExpandProperty Tag

          # Delete existing release if present (idempotent)
          try {
            gh release delete $version --repo $repository --yes
          }
          catch {
          }

          if ($previousTag) {
            Write-Host "Using previous release notes start tag: $previousTag"
          }
          else {
            Write-Host "No previous semantic version tag found. Generating notes from repository start."
          }

          $notesStartTagArg = @()
          if ($previousTag) {
            $notesStartTagArg = @('--notes-start-tag', $previousTag)
          }

          $provenanceNotes = @"
          ## Build provenance

          - VSIX: $($env:VSIX_ATTESTATION_URL)
          - GitHub Action dist archive: $($env:GITHUB_ACTION_DIST_ATTESTATION_URL)
          "@
          $provenanceNotes = $provenanceNotes.Trim()

          # Create release with VSIX attachment
          gh release create $version `
            --repo $repository `
            --title "Release $version" `
            --draft `
            --generate-notes `
            --notes $provenanceNotes `
            @notesStartTagArg `
            --target "release/$version" `
            $vsixFile

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          Write-Host "dry_run=true: tag v${{ needs.prepare-release.outputs.version }} was created/updated for testing, but no GitHub release object was created."

  # ---------------------------------------------------------------------------
  # Job 8: Publish GitHub release
  # Publishes the draft release after marketplace publication succeeds.
  # Skipped entirely in dry-run mode (no draft release exists to publish).
  # ---------------------------------------------------------------------------
  publish-github-release:
    name: Publish GitHub release
    needs: [prepare-release, publish-production, create-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}
          fetch-depth: 0

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "v${{ needs.prepare-release.outputs.version }}"
          gh release edit $version `
            --repo "${{ github.repository }}" `
            --draft=false

      - name: Update floating tags
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $major = "v${{ needs.prepare-release.outputs.major }}"
          $majorMinor = "v${{ needs.prepare-release.outputs.major }}.${{ needs.prepare-release.outputs.minor }}"

          # Force-push floating major and major.minor tags
          git tag -fa $major -m "Floating tag $major" HEAD
          git push origin $major --force

          git tag -fa $majorMinor -m "Floating tag $majorMinor" HEAD
          git push origin $majorMinor --force

  # ---------------------------------------------------------------------------
  # Job 8b: Check semver hygiene
  # Runs after the immutable release + floating tags exist. Independent of
  # the manually-approved Marketplace publish, so semver bookkeeping isn't
  # blocked on/by that approval. Skipped in dry-run (no new immutable
  # release/tag semantics were finalized).
  # ---------------------------------------------------------------------------
  check-semver:
    name: Check SemVer
    needs: [prepare-release, publish-github-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: jessehouwing/actions-semver-checker@v2.1.0
        with:
          floating-versions-use: tags
          check-minor-version: error
          check-release-immutability: error
          ignore-preview-releases: true
          check-releases: error
          token: ${{ secrets.GITHUB_TOKEN }}
          auto-fix: false

  # ---------------------------------------------------------------------------
  # Job 9: Cleanup release branch
  # Runs after successful or cancelled workflows, but leaves the release branch
  # in place after failures so the run remains restartable.
  # ---------------------------------------------------------------------------
  cleanup:
    name: Cleanup release branch
    needs:
      [
        prepare-release,
        validate-documentation-versions,
        preview-release,
        test-azure-pipelines,
        test-github-actions,
        create-release,
        release-approval,
        publish-production,
        publish-github-release,
        check-semver,
      ]
    if: |
      always() &&
      needs.prepare-release.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      (!cancelled() || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Delete release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $branch = "release/v${{ needs.prepare-release.outputs.version }}"
          Write-Host "Deleting branch $branch"
          try {
            gh api `
              --method DELETE `
              "/repos/${{ github.repository }}/git/refs/heads/$branch"
          }
          catch {
            Write-Host "Branch already deleted or not found"
          }
          Write-Host "Branch $branch deleted"
