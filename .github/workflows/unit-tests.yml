# This workflow is managed by gh actions-lock.

name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  test:
    name: Test on ${{ matrix.os }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Block unlisted outbound calls)
        uses: step-security/harden-runner@v2.23.0
        with:
          # Allow-list block mode supports GitHub-hosted Linux, macOS, and Windows:
          # https://docs.stepsecurity.io/github-actions/harden-runner#platform-capability-matrix
          egress-policy: block
          # All three OSes: checkout (github.com), install/tests (registry.npmjs.org),
          # and Node 20 setup (api.github.com, release-assets.githubusercontent.com).
          # https://app.stepsecurity.io/github/jessehouwing/azdo-marketplace/actions/runs/45966271667?tab=network-events
          # Windows git/schannel needs ocsp.sectigo.com:80 during checkout to check
          # revocation of github.com's Sectigo certificate.
          # macOS Apple daemon traffic (configuration.g.aaplimg.com, *.icloud.com,
          # *.apple.com) and Windows OS traffic (crl.microsoft.com, dns.msftncsi.com)
          # are background noise and intentionally not allowed.
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            ocsp.sectigo.com:80

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build v6 packages
        run: npm run build

      - name: Test
        shell: pwsh
        run: |
          $stopMarker = [guid]::NewGuid().ToString()
          Write-Output "::stop-commands::$stopMarker"
          npm run test
          Write-Output "::$stopMarker::"
